<!doctype html>
<html lang="ru" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Александр Кузакин — лонгриды для Хабра и VC, инструменты на ИИ. Томск, удалённо." />
    <title>Александр Кузакин — портфолио</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var valid = stored === 'day' || stored === 'warm' || stored === 'night'
          var theme = valid
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'night'
              : 'day'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme =
            theme === 'night' ? 'dark' : 'light'
        } catch (error) {
          /* хранилище недоступно — остаётся тема по умолчанию из разметки */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
